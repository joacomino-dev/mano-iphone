apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// CocoWash for Android. Same application ID as the iPhone bundle (user decision,
// 2026-11-07): permanent once uploaded to Play.
//
// Versions: versionName follows the iPhone line (0.9.9.1); versionCode is Android's
// own build counter and must only grow (Play rejects a repeated or lower code).
def cocoVersionName = '0.9.9.1'
def cocoVersionCode = 3

def env = { String name -> System.getenv(name) ?: '' }
// main is the store source. Owner supplies Android IDs; until then these sample
// defaults exercise only the mechanism and never qualify as a store-ready AAB.
def sampleAppId = 'ca-app-pub-3940256099942544~3347511713'
def sampleNativeUnit = 'ca-app-pub-3940256099942544/2247696110'
def admobAppId = env('COCO_ADMOB_ANDROID_APP_ID') ?: sampleAppId
def admobNativeUnit = env('COCO_ADMOB_ANDROID_NATIVE_UNIT') ?: sampleNativeUnit
if (!(admobAppId ==~ /ca-app-pub-[0-9]{16}~[0-9]{10}/) || !(admobNativeUnit ==~ /ca-app-pub-[0-9]{16}\/[0-9]{10}/)) throw new GradleException('Invalid Android AdMob ID format')

// Signing never lives in the repository. CI writes the keystores from GitHub
// secrets into the runner's temp folder and passes their paths here:
//   COCO_UPLOAD_KEYSTORE / _PASSWORD / COCO_UPLOAD_KEY_ALIAS / _PASSWORD → release (Play upload key)
//   COCO_DEV_KEYSTORE / _PASSWORD / COCO_DEV_KEY_ALIAS / _PASSWORD       → development APK
// Without them, release stays unsigned and debug uses the runner's throw-away key.
// Public Play licensing key, never the private upload/signing key. Owner configures
// GitHub Secret COCO_PLAY_LICENSE_PUBLIC_KEY; no sample key grants entitlements.
def playLicenseKey = env('COCO_PLAY_LICENSE_PUBLIC_KEY').replaceAll('\\s', '')
if (playLicenseKey && !(playLicenseKey ==~ /[A-Za-z0-9+\/=]+/)) throw new GradleException('Malformed Play public key encoding')

android {
    namespace = "work.joaquin.mano"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "work.joaquin.mano"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode cocoVersionCode
        versionName cocoVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        // Only the seven languages the app speaks (keeps library strings out of the bundle).
        resourceConfigurations += ['es', 'en', 'fr', 'de', 'it', 'ar', 'ja']
        manifestPlaceholders = [admobAppId: admobAppId]
        buildConfigField 'String', 'PLAY_LICENSE_PUBLIC_KEY', '"' + playLicenseKey + '"'
        buildConfigField 'String', 'ADMOB_NATIVE_UNIT', "\"${admobNativeUnit}\""
        buildConfigField 'boolean', 'COCO_TEST_ADS', (System.getenv('COCO_TEST_ADS') == 'true').toString()
    }
    signingConfigs {
        if (env('COCO_UPLOAD_KEYSTORE')) {
            upload {
                storeFile file(env('COCO_UPLOAD_KEYSTORE'))
                storePassword env('COCO_UPLOAD_KEYSTORE_PASSWORD')
                keyAlias env('COCO_UPLOAD_KEY_ALIAS')
                keyPassword env('COCO_UPLOAD_KEY_PASSWORD')
            }
        }
        if (env('COCO_DEV_KEYSTORE')) {
            development {
                storeFile file(env('COCO_DEV_KEYSTORE'))
                storePassword env('COCO_DEV_KEYSTORE_PASSWORD')
                keyAlias env('COCO_DEV_KEY_ALIAS')
                keyPassword env('COCO_DEV_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            // Development never requests live inventory, even when store IDs exist.
            manifestPlaceholders = [admobAppId: sampleAppId]
            buildConfigField 'String', 'ADMOB_NATIVE_UNIT', '"' + sampleNativeUnit + '"'
            if (env('COCO_DEV_KEYSTORE')) signingConfig signingConfigs.development
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (env('COCO_UPLOAD_KEYSTORE')) signingConfig signingConfigs.upload
        }
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    packaging {
        // Native libraries stay uncompressed and page-aligned (16 KB pages, Play requirement).
        jniLibs { useLegacyPackaging = false }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.exifinterface:exifinterface:1.3.7"
    // Ads, consent and purchases (Google's own SDKs; no other third party).
    implementation "com.google.android.gms:play-services-ads:24.4.0"
    implementation "com.google.android.ump:user-messaging-platform:3.2.0"
    implementation "com.android.billingclient:billing:8.0.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'


// Invoked explicitly by distribution preparation; regular unsigned CI still
// exercises sample IDs without claiming they are production configuration.
def storeConfiguration = tasks.register('verifyStoreConfiguration') {
    doLast {
        if (admobAppId == sampleAppId || admobNativeUnit == sampleNativeUnit ||
            admobAppId == 'ca-app-pub-5676353604168025~4587143429' ||
            admobNativeUnit == 'ca-app-pub-5676353604168025/8219266678') throw new GradleException('BLOCKED: real Android AdMob IDs required (not iOS/sample IDs)')
        try {
            def key = java.security.KeyFactory.getInstance('RSA').generatePublic(new java.security.spec.X509EncodedKeySpec(java.util.Base64.decoder.decode(playLicenseKey)))
            if (!(key instanceof java.security.interfaces.RSAPublicKey) || key.modulus.bitLength() < 2048) throw new IllegalArgumentException()
        } catch (Exception ignored) { throw new GradleException('BLOCKED: valid Play licensing public key required') }
        println 'ANDROID_STORE_CONFIGURATION_PASS (configuration only; real purchases/ads still need Play/AdMob QA)'
    }
}
if (env('COCO_ANDROID_STORE_READY') == 'true') tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn(storeConfiguration) }
