name: Verify CocoWash 9.7.2.5 development
on:
  workflow_dispatch:
  push:
    branches: [codex/cocowash-people-recovery, claude/people-crash-b24]
    paths: ['mano/**', '.github/workflows/build-people-dev.yml']
permissions:
  contents: read
concurrency:
  group: cocowash-people-${{ github.ref }}
  cancel-in-progress: true
jobs:
  development:
    if: github.event.repository.private == false && (github.ref == 'refs/heads/codex/cocowash-people-recovery' || github.ref == 'refs/heads/claude/people-crash-b24')
    # Standard public-repository runner; no large/paid runner, no deployment.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    defaults:
      run:
        working-directory: mano
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 10
      - name: Verify logic and protected preview
        run: npm test && npm run check:runtime
      - name: Verify pure Swift logic
        run: |
          mkdir -p build
          swiftc ios/App/App/SignatureIndex.swift tests/swift/main.swift -o build/signature-tests
          build/signature-tests
          swiftc ios/App/App/PeopleGeometry.swift tests/swift-people/main.swift -o build/people-tests
          build/people-tests
          swiftc ios/App/App/PeopleCheckpoint.swift tests/swift-checkpoint/main.swift -o build/checkpoint-tests
          build/checkpoint-tests
          swiftc ios/App/App/PeopleIdentity.swift ios/App/App/PeopleGeometry.swift tests/swift-identities/main.swift -o build/identity-tests
          build/identity-tests
          swiftc ios/App/App/DevelopmentSafety.swift tests/swift-safety/main.swift -o build/safety-tests
          build/safety-tests
          swiftc ios/App/App/PeopleTrace.swift tests/swift-trace/main.swift -o build/trace-tests
          build/trace-tests
      - name: Require real public face grouping API in this SDK
        run: |
          printf '%s\n' 'import Foundation' 'import MediaIntelligence' '@available(iOS 27.0, *) func probe(_ url: URL) throws { _ = try FaceGroupAnalyzer(workingDirectory: url) }' > build/people-api.swift
          xcrun --sdk iphoneos swiftc -typecheck -target arm64-apple-ios17.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" build/people-api.swift
      - name: Build and sync development sources
        run: npm run sync:ios
      - name: Compile development IPA for physical testing
        run: |
          grep -q -e '--cw-paper-texture:url(' ios/App/App/public/assets/*.css
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          # Build 25 keeps existing CocoWash data and the facial index: the
          # index that failed on the phone is the evidence to diagnose.
          if /usr/libexec/PlistBuddy -c 'Print :CocoWashDevelopmentReset' build/ios/Build/Products/Release-iphoneos/App.app/Info.plist; then echo 'Unexpected development reset flag'; exit 1; fi
          mkdir -p build/development/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/App.app build/development/Payload/Mano.app
          cd build/development
          ditto -c -k --keepParent Payload CocoWash-9.7.2.5-development-unsigned.ipa
      - name: Record verification boundary
        run: |
          printf '%s\n' 'DEVELOPMENT ONLY. Not a published or accepted release.' 'No development reset: installing over build 24 keeps CocoWash data and the facial index.' 'No facial matching accuracy, physical privacy transitions, heat, or memory measurements claimed.' 'FaceGroupAnalyzer requires a supported physical iOS 27 device; Simulator does not validate recognition.' > build/development/VALIDATION.txt
          printf 'Source SHA: %s\n' "$GITHUB_SHA" >> build/development/VALIDATION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CocoWash-9.7.2.5-development
          path: |
            mano/build/development/CocoWash-9.7.2.5-development-unsigned.ipa
            mano/build/development/VALIDATION.txt
          retention-days: 7
          if-no-files-found: error

      - name: Verify actual native development startup and same-build relaunch
        timeout-minutes: 10
        run: bash scripts/test-development-startup.sh
      - name: Keep native startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CocoWash-9.7.2.5-startup-evidence
          path: |
            mano/build/startup-safety/*.png
            mano/build/startup-safety/*.log
            mano/build/startup-safety/result.txt
          retention-days: 7
          if-no-files-found: warn
