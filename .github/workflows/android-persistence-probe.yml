name: Diagnose native pending-decision durability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  persistence:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mano
    env:
      COCO_ANDROID_PROBE: persistence
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
      - name: Add read-only boot observer in this diagnostic CI copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/native.tsx');s=p.read_text()
          marker='ReactDOM.createRoot('
          assert s.count(marker)==1
          observer="(window as any).__COCO_BOOT_STORAGE={canonical:localStorage.getItem('cocowash-library-session-v1'),legacy:localStorage.getItem('mano-library-v1')};\n"
          p.write_text(s.replace(marker,observer+marker,1))
          PY
          npm run check:runtime
          npm run sync:android
          cd android
          ./gradlew --no-daemon assembleDebug
      - name: Prepare ephemeral emulator test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compare app recovery with acknowledged strict IndexedDB experiment
        run: bash scripts/android-emulator.sh android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-persistence-diagnostic-${{ github.sha }}
          path: |
            mano/build/android-startup/persistence-probe.json
            mano/build/android-startup/e2e.json
            mano/build/android-startup/emulator-errors.txt
          retention-days: 7
          if-no-files-found: warn
