name: Capture real iPhone store screens in seven languages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    if: github.event.repository.private == false
    # One simulator per language, each with one copy of the demo roll: identical copies in
    # one library would stack as look-alikes, which no real camera roll does.
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lang: [es, en, fr, de, it, ar, ja]
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      COCO_SIMULATOR_MODE: standard
      COCO_STORE_SCREENS: '1'
      COCO_STORE_LANGS: ${{ matrix.lang }}
      # App Store Connect requires the 6.9" class (1320×2868); smaller sizes are derived from it.
      COCO_SIMULATOR_NAME: Pro Max
    defaults:
      run:
        working-directory: mano
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      # Google's ads and consent servers are unreachable for this run only: store screenshots
      # must not show the SDK's «Test mode» ad (App Review rejected that) or its consent form.
      - name: Keep Google ad and consent servers out of the screenshots
        run: |
          for host in googleads.g.doubleclick.net pagead2.googlesyndication.com tpc.googlesyndication.com                       securepubads.g.doubleclick.net fundingchoicesmessages.google.com googleadservices.com                       www.googleadservices.com admob-gmats.uc.r.appspot.com; do
            echo "0.0.0.0 $host" | sudo tee -a /etc/hosts > /dev/null
          done
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder || true
          tail -n 8 /etc/hosts
      - name: Execute real Photos session and capture native screenshots
        run: bash scripts/validate-apple-native.sh --simulator-smoke
      - name: Require actual executed screenshot case and complete files
        run: |
          grep -E 'Test Case .*testStoreScreensSevenLanguages.* passed \(' build/simulator-smoke/ui-test.log
          test "$(cat build/simulator-smoke/ui-test-exit-code.txt)" = 0
          python3 ../scripts/verify-store-screens.py build/simulator-smoke/store-screens ios "$COCO_STORE_LANGS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-native-store-screens-${{ matrix.lang }}-${{ github.sha }}
          path: |
            mano/build/simulator-smoke/store-screens/**
            mano/build/simulator-smoke/ui-test.log
            mano/build/simulator-smoke/ui-test-exit-code.txt
            mano/build/simulator-smoke/photos-read.log
            mano/build/simulator-smoke/selection.txt
            mano/build/simulator-smoke/*.png
            mano/build/simulator-smoke/*.xcresult/**
          retention-days: 7
          if-no-files-found: warn
